name: Probe CI

# Temporary. Answers one question for a fleet of repos whose auto-merge workflow merges a PR
# with GITHUB_TOKEN and then dispatches CI, because a push made with that token starts nothing:
# does a run STARTED BY A DISPATCH still fire the `workflow_run` listeners that deploys use?
# The docs say a workflow_dispatch event is exempt from the loop guard, and say nothing about
# what the resulting run's completion does. Nothing in that fleet has exercised it.
on:
    workflow_dispatch:

jobs:
    probe:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Probe CI ran. actor=${{ github.actor }} event=${{ github.event_name }}"
