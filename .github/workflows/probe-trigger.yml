name: Probe Trigger

# Stands in for the auto-merge job: dispatches CI with the default GITHUB_TOKEN, which is the
# whole point. Dispatching by hand would use a user token and prove nothing.
on:
    workflow_dispatch:

permissions:
    actions: write

jobs:
    dispatch:
        runs-on: ubuntu-latest
        steps:
            - env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
              run: gh workflow run probe-ci.yml --repo "$REPO" --ref main
